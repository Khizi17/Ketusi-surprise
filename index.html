<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For My Ketusi ❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Arial', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  color: white;
}

h1 {
  margin-top: 100px;
  font-size: 45px;
}

p {
  font-size: 22px;
}

button {
  padding: 15px 35px;
  font-size: 22px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  position: absolute;
  transition: 0.3s;
}

#yes {
  background-color: #4CAF50;
  left: 40%;
  top: 60%;
}

#no {
  background-color: #ff4d4d;
  left: 55%;
  top: 60%;
}

.heart {
  position: fixed;
  top: -10px;
  color: red;
  font-size: 20px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh);
  }
}
</style>
</head>

<body>

<h1>Keti (My Ketusi) ❤️</h1>
<p>You are the most beautiful thing in my life.</p>
<p>Will you be my Valentine? 💕</p>

<button id="yes" onclick="yesClicked()">Yes 💖</button>
<button id="no" onmouseover="moveNo()" onclick="moveNo()">No 😢</button>

<script>

function yesClicked() {
  document.body.innerHTML = `
  <h1>YAAAAAY KETUSI 💕💍</h1>
  <p>You just made me the happiest man alive ❤️</p>
  <p>I love you more than anything 😘</p>
  `;
}

function moveNo() {
  const noButton = document.getElementById("no");

  const x = Math.floor(Math.random() * (window.innerWidth - 100));
  const y = Math.floor(Math.random() * (window.innerHeight - 100));

  noButton.style.left = x + "px";
  noButton.style.top = y + "px";
}

// Floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(createHeart, 300);

</script>

</body>
</html>
